schemaVersion: 2
kind: Plugin
metadata:
  name: research
  version: 0.1.0
  description: >-
    Read-only access to the orbit-research canonical Q/H/T/R corpus: a
    validated snapshot, single-record detail and corpus health, generated
    from the shared operation registry rather than hand-duplicated schemas;
    task drafting and linking; the research_investigation job with its
    validate delivery gate; accept, which persists acceptance evidence
    once delivery lands; four read-only dashboard panels (open questions,
    results awaiting acceptance, hypotheses and assessments, corpus
    health); and the orbit-research-native skill.
  publisher: constellation-works
  origin: orbit
  homepage: https://github.com/constellation-works/orbit-research
spec:
  requires:
    orbit: ">=0.25.0 <1.0.0"
    host_api: 1
    platforms: [linux, macos]

  backend:
    type: exec
    command: bin/orbit-research
    args: [orbit-tool]
    timeout_ms: 30000
    sandbox: default

  permissions:
    fs:
      read: ["{{workspace}}"]
      write:
        [
          "{{workspace}}/.orbit-research-tmp",
          "{{workspace}}/_data/orbit-research-operations",
        ]
    network: none
    orbit_tools:
      [
        orbit.task.add,
        orbit.task.list,
        orbit.task.show,
        orbit.task.artifact.get,
        orbit.task.artifact.put,
      ]

  tools:
    - name: list
      description: Read the validated canonical research corpus and tags.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/list.request.json }
    - name: show
      description: >-
        Read one canonical record by id, with its body and lineage. Refuses
        an id absent from the corpus.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/show.request.json }
      cli: { positional: [id] }
    - name: check
      description: >-
        Validate the canonical corpus and report its base revision and
        record/tag counts without returning record bodies. Does not change
        records.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/check.request.json }
    - name: version
      description: >-
        Report the orbit-research-core crate version serving this plugin,
        independent of whether the bound workspace holds a valid corpus.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/version.request.json }
    - name: plan
      description: >-
        Draft an Orbit task (title, description, acceptance_criteria,
        context_files naming the reserved research item) for a Q/H:
        investigation, contribution or synthesis. Read-only; does not
        create or dispatch anything.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/plan.request.json }
    - name: link
      description: >-
        Create the Orbit task from a plan via the orbit.task.add callback,
        tagged research-request:<key> with context_files naming the
        reserved research item. Idempotent by request key: an identical
        retry adopts the one task already tagged with that key instead of
        creating another. Accepts plan's output unchanged; an optional
        context_files must equal the research item's directory, which link
        derives itself, and any other value is refused. The title must contain non-whitespace text; an
        omitted or blank description uses the title.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/link.request.json }
    - name: validate
      description: >-
        Check the research record a run wrote at a checkout path (step input,
        not the bound workspace): owner schema, five written README sections,
        orbit.task/orbit.run naming this run, manifest digests matching local
        input bytes, existing lineage targets, and no ID allocated or other
        record changed. Fails the call on any finding. Read-only.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/validate.request.json }
    - name: accept
      description: >-
        After delivery lands on the named task (status review or done):
        re-run validate at the published commit on the bound workspace, then
        persist research-acceptance.json (record id, blob, commit, artifact
        digests, run id) as a task artifact. Idempotent: a matching retry
        returns the stored evidence without writing again. Refuses before
        delivery lands, for a failed or non-terminal run, on a validate
        finding, or on a stored-evidence mismatch.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/accept.request.json }
    - name: open-questions
      description: >-
        Panel source. Lists the questions still open, each with its tags and
        the Orbit tasks recorded on research items working on it. A workspace
        with no usable corpus, or no open question, answers with one readable
        status row instead of an error. Read-only.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/open-questions.request.json }
    - name: awaiting-acceptance
      description: >-
        Panel source. Lists research results delivered by an investigation run
        (committed with orbit.task and orbit.run) whose task has no
        research-acceptance.json artifact, reading each task through the
        orbit.task.show and orbit.task.artifact.get callbacks. A task that
        cannot be read shows as acceptance unknown, never as accepted. Read-only.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/awaiting-acceptance.request.json }
    - name: hypotheses
      description: >-
        Panel source. Lists each hypothesis with its current revision and
        status and, per revision, the latest verdict from each research
        result. Results that disagree on a revision keep separate rows and
        mark the revision disputed. Read-only.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/hypotheses.request.json }
    - name: corpus-health
      description: >-
        Panel source. Reports corpus validity, base revision and record counts
        by kind and status as flat label/value pairs. A workspace with no
        usable corpus answers with a readable status instead of an error.
        Read-only.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/corpus-health.request.json }

  definitions:
    activities: [definitions/activities/*.yaml]
    jobs: [definitions/jobs/*.yaml]

  skills: [skills/native]

  web:
    panels:
      - id: open-questions
        title: Open questions
        source: tool:open-questions
        render: table
        group: operations
        refresh_ms: 30000
      - id: awaiting-acceptance
        title: Results awaiting acceptance
        source: tool:awaiting-acceptance
        render: table
        group: operations
        refresh_ms: 60000
      - id: hypotheses
        title: Hypotheses and assessments
        source: tool:hypotheses
        render: table
        group: operations
        refresh_ms: 30000
      - id: corpus-health
        title: Corpus health
        source: tool:corpus-health
        render: kv
        group: diagnostics
        refresh_ms: 60000

  tests: [tests/conformance/*.yaml]
