# See list.yaml: the conformance workspace is never a valid corpus, so this
# pins the deterministic refusal (Application::local fails before `link`
# ever reaches a host callback). `orbit plugin test` has no fixture corpus
# and no way to fake the orbit.task.add/orbit.task.list callbacks, so the
# real success, retry-adopts-the-same-task, ambiguous (>1 tagged tasks) and
# unresolved (recorded intent, no tagged task found) cases are covered by
# `cargo test -p orbit-research-cli` (src/tests/plugin.rs), which drives
# `serve_plugin_tool_call_with_host` with an in-memory fake task host.
schemaVersion: 1
kind: PluginTest
tests:
  - name: link_refuses_when_the_workspace_has_no_corpus
    tool: link
    input: {"research_id": "R001", "request_key": "conformance", "title": "t"}
    expect:
      error:
        code: corpus_unavailable
