# The conformance workspace is always empty and not a Git repository, so
# `list` deterministically finds no corpus there. Real record output is
# covered by `cargo test -p orbit-research-cli` (src/tests/plugin.rs) against
# a real git-backed fixture; see version.yaml for why.
schemaVersion: 1
kind: PluginTest
tests:
  - name: list_refuses_when_the_workspace_has_no_corpus
    tool: list
    input: {}
    expect:
      error:
        code: corpus_unavailable
