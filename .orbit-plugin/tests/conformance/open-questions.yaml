# Panel source. The conformance workspace is never a valid corpus, so this
# pins the readable "no corpus" state the dashboard shows instead of an error
# string. Real rows, the empty states of a valid corpus and the task callbacks
# are covered by `cargo test -p orbit-research-cli` (src/tests/panels.rs) over
# a real git-backed fixture.
schemaVersion: 1
kind: PluginTest
tests:
  - name: open_questions_explains_that_the_workspace_has_no_corpus
    tool: open-questions
    input: {}
    expect:
      output:
        - status: "This workspace has no research corpus. The plugin reads the workspace root as the corpus, and `orbit-research workspace init` refuses a non-empty directory, so a research corpus needs its own new, empty directory: create it with `orbit-research workspace init <dir>` and register that directory as an Orbit workspace."
  - name: open_questions_refuses_unknown_input_fields
    tool: open-questions
    input: {"unexpected": true}
    expect:
      error:
        code: invalid_request
