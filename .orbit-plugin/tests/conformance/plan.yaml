# See list.yaml: the conformance workspace is never a valid corpus, so this
# pins the deterministic refusal (Application::local fails before the shape
# is even read). Real drafting success for each shape is covered by
# `cargo test -p orbit-research-cli` (src/tests/plugin.rs), which calls the
# same `serve_plugin_tool_call` entry point this backend serves against a
# real git-backed fixture with a reserved research item.
schemaVersion: 1
kind: PluginTest
tests:
  - name: plan_refuses_when_the_workspace_has_no_corpus
    tool: plan
    input: {}
    expect:
      error:
        code: corpus_unavailable
