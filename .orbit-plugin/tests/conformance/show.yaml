# See list.yaml: the conformance workspace is never a valid corpus, so `show`
# refuses before it can even check whether the id exists. The "unknown record
# id" refusal (`record_not_found`) needs an actually open corpus that simply
# lacks the id, which this sandbox cannot provide; it is covered by
# `cargo test -p orbit-research-cli` (src/tests/plugin.rs) against a real
# git-backed fixture, calling the same `serve_plugin_tool_call` entry point.
schemaVersion: 1
kind: PluginTest
tests:
  - name: show_refuses_when_the_workspace_has_no_corpus
    tool: show
    input: { id: "Q001" }
    expect:
      error:
        code: corpus_unavailable
