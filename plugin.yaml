schemaVersion: 2
kind: Plugin
metadata:
  name: research
  version: 0.1.0
  description: >-
    Read-only access to the orbit-research canonical Q/H/T/R corpus: a
    validated snapshot, single-record detail and corpus health, generated
    from the shared operation registry rather than hand-duplicated schemas;
    task drafting and linking; and the research_investigation job with its
    validate delivery gate.
  publisher: constellation-works
  origin: orbit
  homepage: https://github.com/constellation-works/orbit-research
spec:
  requires:
    orbit: ">=0.24.0 <1.0.0"
    host_api: 1
    platforms: [linux, macos]

  backend:
    type: exec
    command: bin/orbit-research
    args: [orbit-tool]
    timeout_ms: 30000
    sandbox: default

  permissions:
    fs:
      read: ["{{workspace}}"]
    network: none
    orbit_tools: [orbit.task.add, orbit.task.list]

  tools:
    - name: list
      description: Read the validated canonical research corpus and tags.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/list.request.json }
    - name: show
      description: >-
        Read one canonical record by id, with its body and lineage. Refuses
        an id absent from the corpus.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/show.request.json }
      cli: { positional: [id] }
    - name: check
      description: >-
        Validate the canonical corpus and report its base revision and
        record/tag counts without returning record bodies. Does not change
        records.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/check.request.json }
    - name: version
      description: >-
        Report the orbit-research-core crate version serving this plugin,
        independent of whether the bound workspace holds a valid corpus.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/version.request.json }
    - name: plan
      description: >-
        Draft an Orbit task (title, description, acceptance_criteria,
        context_files naming the reserved research item) for a Q/H:
        investigation, contribution or synthesis. Read-only; does not
        create or dispatch anything.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/plan.request.json }
    - name: link
      description: >-
        Create the Orbit task from a plan via the orbit.task.add callback,
        tagged research-request:<key> with context_files naming the
        reserved research item. Idempotent by request key: an identical
        retry adopts the one task already tagged with that key instead of
        creating another.
      execution_kind: mutating
      mcp_scope: workspace
      input_schema: { $ref: schemas/link.request.json }
    - name: validate
      description: >-
        Check the research record a run wrote at a checkout path (step input,
        not the bound workspace): owner schema, five written README sections,
        orbit.task/orbit.run naming this run, manifest digests matching local
        input bytes, existing lineage targets, and no ID allocated or other
        record changed. Fails the call on any finding. Read-only.
      execution_kind: read_only
      mcp_scope: workspace
      input_schema: { $ref: schemas/validate.request.json }

  definitions:
    activities: [activities/*.yaml]
    jobs: [jobs/*.yaml]

  tests: [tests/conformance/*.yaml]
